<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Rihla — Umrah Back Office</title>
<meta name="description" content="Umrah group operations: hajis, rooms, buses, payments, and staff roles." />

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0E3B3A">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink:#1C2321;
    --sand:#F2ECDD;
    --sand-deep:#E4DAC0;
    --teal:#0E3B3A;
    --teal-2:#155953;
    --gold:#B9862F;
    --gold-soft:#E7CE9C;
    --line:#D8CBA6;
    --danger:#9B3A2E;
    --ok:#3D6B4C;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--sand);color:var(--ink);font-family:'Inter',sans-serif;font-size:14px;overscroll-behavior-y:contain;}
  button,.nav-item,.bottom-nav-item,select,input,.pill{-webkit-tap-highlight-color:transparent;}
  .nav-item,.bottom-nav-item{user-select:none;-webkit-user-select:none;}
  .nav-item:active,.bottom-nav-item:active{opacity:.7;}
  h1,h2,h3{font-family:'Fraunces',serif;font-weight:600;margin:0;color:var(--teal);}
  .mono{font-family:'IBM Plex Mono',monospace;}
  button{font-family:'Inter',sans-serif;cursor:pointer;border:none;border-radius:var(--radius);padding:8px 14px;font-size:13px;font-weight:600;transition:transform .08s ease, background .15s ease;}
  button:active{transform:translateY(1px);}
  button.primary{background:var(--teal);color:var(--sand);}
  button.primary:hover{background:var(--teal-2);}
  button.gold{background:var(--gold);color:#2b1d05;}
  button.gold:hover{background:#c9974a;}
  button.ghost{background:transparent;color:var(--teal);border:1px solid var(--line);}
  button.ghost:hover{background:var(--sand-deep);}
  #sidebar button.ghost{color:var(--sand);border-color:rgba(242,236,221,.35);}
  #sidebar button.ghost:hover{background:rgba(255,255,255,.08);}
  button.danger{background:transparent;color:var(--danger);border:1px solid var(--danger);}
  input,select{font-family:'Inter',sans-serif;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fffdf7;color:var(--ink);font-size:13px;width:100%;}
  input:focus,select:focus{outline:2px solid var(--gold-soft);}
  label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#6b6252;font-weight:600;display:block;margin-bottom:4px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#6b6252;padding:8px 10px;border-bottom:2px solid var(--teal);}
  td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle;}
  tr:hover td{background:#faf6ea;}
  .card{background:#fffdf7;border:1px solid var(--line);border-radius:var(--radius);padding:18px;}
  .pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700;}
  .pill.ok{background:#e0ecdf;color:var(--ok);}
  .pill.warn{background:#f5e6cf;color:var(--gold);}
  .pill.bad{background:#f3ded9;color:var(--danger);}
  .offline-banner{background:#f5e6cf;color:#5b4419;font-size:12.5px;font-weight:600;padding:9px 14px;border-radius:8px;margin-bottom:16px;text-align:center;}
  #app{min-height:100vh;display:flex;}
  #sidebar{width:210px;background:var(--teal);color:var(--sand);padding:22px 14px;flex-shrink:0;display:flex;flex-direction:column;position:relative;}
  #sidebar h1{color:var(--sand);font-size:22px;letter-spacing:.02em;}
  #sidebar .tagline{font-size:11px;color:var(--gold-soft);margin-top:2px;margin-bottom:26px;font-style:italic;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;margin-bottom:3px;cursor:pointer;font-weight:500;color:#cfe0dc;}
  .nav-item:hover{background:rgba(255,255,255,.06);}
  .nav-item.active{background:var(--gold);color:#2b1d05;font-weight:700;}
  .nav-icon{display:flex;flex-shrink:0;opacity:.9;}
  #main-wrap{flex:1;display:flex;flex-direction:column;min-width:0;}
  #main{flex:1;padding:26px 34px;max-width:1200px;min-width:0;}
  .topbar{display:flex;align-items:center;gap:14px;margin-bottom:22px;}
  .group-select{max-width:280px;}
  .mobile-topbar{display:none;}
  .grid{display:grid;gap:14px;}
  .grid-4{grid-template-columns:repeat(4,1fr);}
  .sidebar-close-btn{display:none;position:absolute;top:14px;right:14px;background:transparent;border:none;color:var(--sand);font-size:20px;line-height:1;cursor:pointer;padding:4px;}
  .sidebar-backdrop{display:none;}
  .install-btn{margin-top:10px;width:100%;}
  .table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .bottom-nav{display:none;}
  .stat-label{font-size:11px;text-transform:uppercase;color:#6b6252;letter-spacing:.05em;font-weight:600;}
  .stat-value{font-family:'Fraunces',serif;font-size:28px;color:var(--teal);margin-top:4px;}
  .row-actions{display:flex;gap:6px;}
  #progress-bar{position:fixed;top:0;left:0;right:0;height:3px;z-index:500;overflow:hidden;opacity:0;transition:opacity .2s ease;pointer-events:none;}
  #progress-bar.active{opacity:1;}
  #progress-bar .bar{position:absolute;top:0;left:0;height:100%;width:40%;background:var(--gold);animation:progress-slide 1.1s ease-in-out infinite;}
  @keyframes progress-slide{0%{transform:translateX(-100%);}100%{transform:translateX(350%);}}
  #notice-root{position:fixed;top:10px;left:0;right:0;z-index:400;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 12px;}
  .toast{pointer-events:auto;max-width:420px;width:100%;background:var(--sand);border:1px solid var(--line);border-left:4px solid var(--teal);border-radius:10px;padding:11px 12px;box-shadow:0 6px 20px rgba(28,35,33,.18);display:flex;align-items:flex-start;gap:8px;font-size:13.5px;line-height:1.45;animation:toast-in .22s ease;}
  .toast.success{border-left-color:var(--ok);}
  .toast.error{border-left-color:var(--danger);}
  .toast.leaving{animation:toast-out .18s ease forwards;}
  .toast-close{background:none;border:none;cursor:pointer;color:#8a8168;font-size:16px;line-height:1;padding:0;flex-shrink:0;}
  @keyframes toast-in{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:translateY(0);}}
  @keyframes toast-out{from{opacity:1;}to{opacity:0;transform:translateY(-8px);}}
  .modal-bg{position:fixed;inset:0;background:rgba(28,35,33,.5);display:flex;align-items:center;justify-content:center;z-index:100;}
  .modal{background:var(--sand);border-radius:14px;padding:24px;width:420px;max-width:90vw;max-height:85vh;overflow-y:auto;border:1px solid var(--line);}
  .modal h3{margin-bottom:16px;}
  .field{margin-bottom:12px;}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .toolbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
  .empty{padding:40px;text-align:center;color:#8a8168;}
  .empty h3{color:#8a8168;margin-bottom:6px;}
  .auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--teal);}
  .auth-card{background:var(--sand);border-radius:16px;padding:40px;width:360px;}
  .auth-card h1{color:var(--teal);font-size:30px;}
  .auth-card .tagline{color:var(--gold);font-style:italic;margin-bottom:24px;}
  .link-btn{background:none;border:none;color:var(--teal-2);text-decoration:underline;font-size:12px;padding:0;}
  .badge-count{background:var(--gold-soft);color:#5b4419;border-radius:99px;padding:1px 7px;font-size:11px;margin-left:6px;}
  ::-webkit-scrollbar{width:8px;} ::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}
  .assign-list{max-height:280px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;}
  .assign-row{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);}
  .assign-row:last-child{border-bottom:none;}
  .family-cluster{border-bottom:2px solid var(--line);}
  .family-cluster:last-child{border-bottom:none;}
  .family-cluster-header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 10px;background:var(--sand-deep);}
  .family-cluster-header button{padding:4px 9px;font-size:11px;}
  .family-warning{font-size:11px;color:var(--danger);padding:3px 10px;background:#fdf6f0;}
  .summary-list{display:flex;flex-direction:column;gap:8px;}
  .summary-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 16px;border:1px solid var(--line);border-radius:10px;background:#fffdf7;cursor:pointer;transition:background .1s ease;}
  .summary-row:hover{background:var(--sand-deep);}
  .summary-name{font-weight:700;color:var(--ink);}
  .summary-sub{font-size:12px;color:#8a8168;margin-top:3px;}
  .summary-chevron{color:#8a8168;flex-shrink:0;}
  .detail-list{display:flex;flex-direction:column;gap:10px;}
  .detail-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-bottom:9px;border-bottom:1px solid var(--line);}
  .detail-row:last-child{border-bottom:none;padding-bottom:0;}
  .detail-label{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#6b6252;font-weight:600;flex-shrink:0;}
  .detail-value{font-size:13px;color:var(--ink);text-align:right;}
  .capacity-bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px;}
  .capacity-fill{height:100%;background:var(--teal);}
  .capacity-fill.over{background:var(--danger);}
  .collector-template{display:flex;flex-wrap:wrap;gap:14px;align-items:center;padding:10px 14px;background:var(--sand-deep);border-radius:8px;margin-bottom:12px;}
  .trip-row{display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);}
  .trip-row:last-child{border-bottom:none;}
  .trip-row .who{min-width:170px;flex:1 1 170px;}
  .trip-check{display:flex;align-items:center;gap:6px;font-size:12px;color:#4a4436;white-space:nowrap;}
  .trip-check input{width:auto;}
  .trip-total{font-weight:700;margin-left:auto;white-space:nowrap;}
  .collector-footer{position:sticky;bottom:0;background:var(--sand);border-top:2px solid var(--teal);padding:14px 18px;margin-top:16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;border-radius:0 0 var(--radius) var(--radius);box-shadow:0 -4px 16px rgba(28,35,33,.08);}
  .collector-payment-fields{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;flex:1;min-width:280px;max-width:520px;}

  /* ---- Custom searchable select ---- */
  .cselect{position:relative;}
  .cselect-trigger{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;background:#fffdf7;border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:13px;font-weight:400;color:var(--ink);text-align:left;}
  .cselect-trigger:focus{outline:2px solid var(--gold-soft);}
  .cselect-trigger[disabled]{opacity:.5;cursor:not-allowed;}
  .cselect-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .cselect-chevron{flex-shrink:0;color:#8a8168;transition:transform .15s ease;}
  .cselect.open .cselect-chevron{transform:rotate(180deg);}
  .cselect-panel{display:none;position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:220;background:#fffdf7;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(28,35,33,.18);overflow:hidden;}
  .cselect.open .cselect-panel{display:block;}
  .cselect-search{border:none;border-bottom:1px solid var(--line);border-radius:0;font-size:13px;padding:9px 10px;width:100%;}
  .cselect-search:focus{outline:none;}
  .cselect-options{max-height:220px;overflow-y:auto;}
  .cselect-option{padding:8px 10px;font-size:13px;cursor:pointer;}
  .cselect-option:hover{background:var(--sand-deep);}
  .cselect-option.selected{background:var(--gold-soft);font-weight:600;}
  .cselect-empty,.cselect-no-match{padding:10px;font-size:12px;color:#8a8168;text-align:center;}

  /* ---- Custom date picker ---- */
  .cdate{position:relative;}
  .cdate-trigger{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;background:#fffdf7;border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:13px;font-weight:400;color:var(--ink);text-align:left;}
  .cdate-trigger:focus{outline:2px solid var(--gold-soft);}
  .cdate-icon{flex-shrink:0;color:#8a8168;}
  .cdate-panel{display:none;position:absolute;top:calc(100% + 4px);left:0;z-index:220;width:260px;background:#fffdf7;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(28,35,33,.18);padding:12px;}
  .cdate.open .cdate-panel{display:block;}
  .cdate-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
  .cdate-month-label{font-weight:700;font-size:13px;color:var(--teal);}
  .cdate-nav{background:transparent;border:1px solid var(--line);border-radius:6px;width:26px;height:26px;padding:0;font-size:15px;line-height:1;color:var(--teal);}
  .cdate-nav:hover{background:var(--sand-deep);}
  .cdate-weekdays{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:2px;}
  .cdate-weekday{text-align:center;font-size:10px;font-weight:700;color:#8a8168;text-transform:uppercase;}
  .cdate-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
  .cdate-cell{text-align:center;padding:6px 0;font-size:12.5px;border-radius:6px;cursor:pointer;}
  .cdate-cell.empty{cursor:default;}
  .cdate-cell:not(.empty):hover{background:var(--sand-deep);}
  .cdate-cell.today{border:1px solid var(--gold);}
  .cdate-cell.selected{background:var(--teal);color:var(--sand);font-weight:700;}
  .cdate-footer{display:flex;gap:8px;margin-top:10px;}
  .cdate-footer button{padding:6px 10px;font-size:12px;}

  @media (max-width:900px){
    #main{max-width:100%;}
  }

  @media (max-width:768px){
    #app{position:relative;}
    #sidebar{
      position:fixed;top:0;left:0;bottom:0;width:250px;max-width:80vw;
      transform:translateX(-100%);transition:transform .25s ease;z-index:70;
      box-shadow:2px 0 24px rgba(0,0,0,.3);
    }
    #app.nav-open #sidebar{transform:translateX(0);}
    .sidebar-close-btn{display:block;}
    .sidebar-backdrop{
      display:block;position:fixed;inset:0;background:rgba(0,0,0,0);pointer-events:none;
      transition:background .25s ease;z-index:65;
    }
    #app.nav-open .sidebar-backdrop{background:rgba(20,20,18,.45);pointer-events:auto;}
    #main{padding:16px 16px calc(76px + env(safe-area-inset-bottom, 0px));}
    .grid-4{grid-template-columns:repeat(2,1fr);}
    .two-col{grid-template-columns:1fr;}
    .auth-card{width:92vw;max-width:400px;padding:28px 22px;}
    input,select,textarea{font-size:16px;padding:10px 12px;} /* prevent iOS auto-zoom on focus + bigger tap area */
    button{padding:10px 14px;min-height:40px;}
    .cselect-trigger,.cdate-trigger,.cselect-search{font-size:16px;padding:10px 12px;min-height:40px;}
    .row-actions{flex-wrap:wrap;}
    .collector-payment-fields{grid-template-columns:1fr;min-width:0;}
    .collector-footer{position:static;flex-direction:column;align-items:stretch;box-shadow:none;}
    .trip-row .who{min-width:100%;}
    .mobile-topbar{
      display:flex;align-items:center;justify-content:center;
      position:sticky;top:0;z-index:40;
      background:var(--teal);color:var(--sand);
      padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top, 0px));
      font-family:'Fraunces',serif;font-weight:600;font-size:17px;letter-spacing:.01em;
      box-shadow:0 2px 10px rgba(20,20,18,.15);
    }
    .bottom-nav{
      display:flex;position:fixed;left:0;right:0;bottom:0;z-index:55;
      background:var(--teal);border-top:1px solid rgba(255,255,255,.1);
      padding-bottom:env(safe-area-inset-bottom, 0px);
    }
    .bottom-nav-item{
      flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
      min-height:54px;text-align:center;padding:8px 4px;font-size:10.5px;font-weight:600;
      color:#cfe0dc;cursor:pointer;letter-spacing:.01em;-webkit-tap-highlight-color:transparent;
    }
    .bottom-nav-item.active{color:var(--gold-soft);}
    .bottom-nav-item svg{opacity:.85;}
    .bottom-nav-item.active svg{opacity:1;}
  }

  @media (max-width:600px){
    .modal-bg{align-items:stretch;justify-content:stretch;padding:0;}
    .modal{width:100%;max-width:100%;height:100%;max-height:100%;border-radius:0;padding:20px 16px 28px;}
    .stat-value{font-size:22px;}
    h2{font-size:19px;}

    /* Responsive tables: rows become stacked cards instead of scrolling sideways */
    .table-wrap{overflow-x:visible;}
    .table-wrap table{border-collapse:separate;border-spacing:0;}
    .table-wrap thead{display:none;}
    .table-wrap tr{
      display:block;background:#fffdf7;border:1px solid var(--line);border-radius:10px;
      padding:12px 14px;margin-bottom:10px;
    }
    .table-wrap tr:last-child{margin-bottom:0;}
    .table-wrap td{display:block;border:none;padding:5px 0;vertical-align:top;}
    .table-wrap td[data-label]::before{
      content:attr(data-label);display:block;font-size:10.5px;text-transform:uppercase;
      letter-spacing:.05em;color:#6b6252;font-weight:700;margin-bottom:2px;
    }
    .table-wrap td:first-child{padding-top:0;}
    .table-wrap td:last-child{padding-bottom:0;}
    .table-wrap .row-actions{margin-top:4px;}
  }

  @media (max-width:420px){
    .grid-4{grid-template-columns:1fr 1fr;}
  }

</style>

<body>
<div id="progress-bar"><div class="bar"></div></div>
<div id="root"></div>
<div id="notice-root"></div>

<script>
const SUPABASE_URL = "https://wbsknbdoefmzkwidmoqn.supabase.co";
const SUPABASE_KEY = "sb_publishable_Kjg7FZ1qW0yKJkWosQMBTA_Ojouvu2h";
const REQUEST_TIMEOUT_MS = 20000;

let pendingRequests = 0;
function reenablePendingButtons(){
  document.querySelectorAll('button[data-pending-label]').forEach(btn=>{
    btn.disabled = false;
    btn.textContent = btn.dataset.pendingLabel;
    delete btn.dataset.pendingLabel;
  });
}
function setPending(delta){
  pendingRequests = Math.max(0, pendingRequests + delta);
  const bar = document.getElementById('progress-bar');
  if(bar) bar.classList.toggle('active', pendingRequests > 0);
  if(pendingRequests === 0) reenablePendingButtons();
}

function updateImportProgress(step, total, label){
  const wrap = document.getElementById('import-progress-wrap');
  if(!wrap) return;
  wrap.style.display = 'block';
  const pct = total ? Math.round((step/total)*100) : 0;
  const fill = document.getElementById('import-progress-fill');
  const pctLabel = document.getElementById('import-progress-pct');
  const textLabel = document.getElementById('import-progress-label');
  if(fill) fill.style.width = pct + '%';
  if(pctLabel) pctLabel.textContent = pct + '%';
  if(textLabel) textLabel.textContent = label;
}
function resetImportProgress(){
  const wrap = document.getElementById('import-progress-wrap');
  if(wrap) wrap.style.display = 'none';
  const importBtn = document.getElementById('bulk-import-btn');
  if(importBtn){ importBtn.disabled = false; importBtn.textContent = 'Import'; }
  const cancelBtn = document.getElementById('bulk-import-cancel-btn');
  if(cancelBtn) cancelBtn.disabled = false;
}

async function trackedFetch(input, init){
  setPending(1);
  const method = (init?.method || 'GET').toUpperCase();
  const isIdempotent = method === 'GET';
  const maxAttempts = isIdempotent ? 3 : 1;
  let lastErr;
  try{
    for(let attempt=1; attempt<=maxAttempts; attempt++){
      const controller = new AbortController();
      const timeoutId = setTimeout(()=>controller.abort(), REQUEST_TIMEOUT_MS);
      try{
        const res = await fetch(input, { ...init, signal: init?.signal || controller.signal });
        clearTimeout(timeoutId);
        return res;
      } catch(err){
        clearTimeout(timeoutId);
        lastErr = err;
        if(attempt < maxAttempts) await new Promise(r=>setTimeout(r, 400*attempt));
      }
    }
    throw lastErr;
  } finally {
    setPending(-1);
  }
}

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { global: { fetch: trackedFetch } });

window.addEventListener('unhandledrejection', (e)=>{
  console.error('Unhandled error:', e.reason);
  showNotice('Connection problem — please check your internet and try again.', 'error');
  e.preventDefault();
});

document.addEventListener('submit', (e)=>{
  const btn = e.target.querySelector('button[type="submit"]');
  if(btn && !btn.disabled && !btn.dataset.pendingLabel){
    btn.dataset.pendingLabel = btn.textContent;
    btn.disabled = true;
    btn.textContent = 'Saving…';
  }
}, true);

async function initAuth(){
  const { data } = await sb.auth.getSession();
  state.session = data.session;
  sb.auth.onAuthStateChange(async (_event, session) => {
    state.session = session;
    if(session) {
      if(navigator.onLine){
        await loadMyRole();
        if(state.isHaji) await loadMyHajiData(); else await loadAll();
      } else {
        restoreFromCache();
      }
    } else {
      state.myRole = null; state.isHaji = false; state.myHaji = null;
    }
    render();
  });
  if(state.session && !navigator.onLine){
    restoreFromCache();
    render();
    return;
  }
  if(state.session) await loadMyRole();
  render();
  if(state.session){
    if(state.isHaji) await loadMyHajiData(); else await loadAll();
  }
}

async function loadMyRole(){
  const uid = state.session?.user?.id;
  if(!uid) return;
  const { data: staffRow } = await sb.from('staff').select('*').eq('id', uid).maybeSingle();
  if(staffRow){ state.myRole = staffRow.role; state.isHaji = false; state.myHaji = null; return; }
  const { data: hajiRow } = await sb.from('hajis').select('*').eq('auth_user_id', uid).maybeSingle();
  if(hajiRow){ state.myRole = 'haji'; state.isHaji = true; state.myHaji = hajiRow; return; }
  state.myRole = 'agent'; state.isHaji = false;
}

function roleLabel(role){
  const labels = { super_admin:'Qibla Owners', admin:'Qibla Admins', agent:'Helper', accountant:'Accountant', haji:'Pilgrim' };
  return labels[role] || role || '—';
}
function titleCase(s){ return (s||'').replace(/_/g,' ').replace(/\b\w/g, c=>c.toUpperCase()); }
function canRole(action, role){
  if(role==='super_admin') return true; // super admins (system owners) can do everything staff can
  const rules = {
    manageGroups: ['admin'],
    managePackages: ['admin','accountant'],
    manageHajis: ['admin','agent'],
    manageRooms: ['admin','agent'],
    manageBuses: ['admin','agent'],
    managePayments: ['admin','accountant'],
    manageStaff: ['admin'],
  };
  return (rules[action]||[]).includes(role);
}
function can(action){ return canRole(action, state.myRole); }

async function signIn(email, password){

    showNotice('Enter your email and password.', 'error');
    return;
  }
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if(error){ showNotice(error.message, 'error'); return; }
}
async function signUp(email, password, fullName){
  if(!fullName?.trim() || !email?.trim() || !password){
    showNotice('Fill in your name, email, and password to create an account.', 'error');
    return;
  }
  const { data, error } = await sb.auth.signUp({ email, password });
  if(error){ showNotice(error.message, 'error'); return; }
  if(!data.session){
    showNotice('Account created — check your email to confirm it, then sign in.', 'success');
    return;
  }
  const { count } = await sb.from('staff').select('*', { count:'exact', head:true });
  const role = count === 0 ? 'super_admin' : 'agent';
  const { error: staffErr } = await sb.from('staff').insert({ id: data.user.id, full_name: fullName, role });
  if(staffErr){
    showNotice(`Your login was created, but we couldn't set up your access (${staffErr.message}). Ask an existing Qibla Admin to add you under Staff.`, 'error');
    return;
  }
  showNotice(role==='super_admin'
    ? "Account created — you're the first user, so you've been made Qibla Owners (system owner)."
    : "Account created with basic access. A Qibla Admin can upgrade your role in Staff once you're set up.", 'success');
}

    sb.from('role_settings').select('*'),
    sb.from('groups').select('*').eq('id', h.group_id).maybeSingle(),
    h.package_id ? sb.from('packages').select('*').eq('id', h.package_id).maybeSingle() : Promise.resolve({data:null}),
    sb.from('payments').select('*').eq('haji_id', h.id).order('paid_on', {ascending:false}),
    sb.from('room_assignments').select('*, rooms(*)').eq('haji_id', h.id),
    sb.from('bus_assignments').select('*, buses(*, trip_types(name))').eq('haji_id', h.id),
  ]);
  state.roleSettings = roleSettings || [];
  state.myGroup = group || null;
  state.myPackage = pkg || null;
  state.myPayments = payments || [];
  state.myRoomAssignments = roomAssign || [];
  state.myBusAssignments = busAssign || [];

    const { data: items } = await sb.from('payment_trip_items').select('*').in('payment_id', paymentIds);

    state.myPaymentTripItems = [];
  }

let appliedDefaultView = false;
let lastRenderedView = null;
function applyRestoredView(){
  if(appliedDefaultView) return;
  appliedDefaultView = true;
  const permitted = permittedNavItems(state.myRole);
  const restoredView = pendingRestoredView?.view;
  const isRestorable = restoredView && (RESTORABLE_VIEWS.includes(restoredView) || restoredView==='tripCollector');
  const isPermitted = isRestorable && permitted.some(d=>d.activeViews.includes(restoredView));
  if(isPermitted){
    if(restoredView==='tripCollector') openTripCollector();
    else state.view = restoredView;
    return;
  }
  const rs = state.roleSettings.find(r=>r.role===state.myRole);
  const def = rs?.default_view && NAV_ITEM_DEFS.find(d=>d.key===rs.default_view && d.permitted(state.myRole));
  state.view = def ? def.activeViews[0] : 'dashboard';
}

async function loadGroupData(){
  const gid = state.activeGroupId;
  if(!gid){ state.packages=[]; state.hajis=[]; state.rooms=[]; state.roomAssignments=[]; state.buses=[]; state.busAssignments=[]; state.payments=[]; state.tripTypes=[]; return; }
  const [{data:packages},{data:hajis},{data:rooms},{data:buses},{data:tripTypes}] = await Promise.all([
    sb.from('packages').select('*').eq('group_id', gid),
    sb.from('hajis').select('*').eq('group_id', gid).order('full_name'),
    sb.from('rooms').select('*').eq('group_id', gid).order('room_number'),
    sb.from('buses').select('*').eq('group_id', gid).order('bus_number'),
    sb.from('trip_types').select('*').eq('group_id', gid).order('name'),
  ]);
  state.packages = packages || [];
  state.hajis = hajis || [];
  state.rooms = rooms || [];
  state.buses = buses || [];
  state.tripTypes = tripTypes || [];

  const hajiIds = state.hajis.map(h=>h.id);
  if(hajiIds.length){
    const [{data:ra},{data:ba},{data:pay}] = await Promise.all([
      sb.from('room_assignments').select('*').in('haji_id', hajiIds),
      sb.from('bus_assignments').select('*').in('haji_id', hajiIds),
      sb.from('payments').select('*').in('haji_id', hajiIds).order('paid_on',{ascending:false}),
    ]);
    state.roomAssignments = ra || [];
    state.busAssignments = ba || [];
    state.payments = pay || [];
    const paymentIds = state.payments.map(p=>p.id);
    if(paymentIds.length){
      const { data: pti } = await sb.from('payment_trip_items').select('*').in('payment_id', paymentIds);
      state.paymentTripItems = pti || [];
    } else {
      state.paymentTripItems = [];
    }
  } else {
    state.roomAssignments = []; state.busAssignments = []; state.payments = []; state.paymentTripItems = [];
  }
  saveCacheSnapshot();
}

// ---------- HELPERS ----------
function hajiById(id){ return state.hajis.find(h=>h.id===id); }
function staffById(id){ return state.staffList.find(s=>s.id===id); }
function packageById(id){ return state.packages.find(p=>p.id===id); }
function hajiPaid(hajiId){ return state.payments.filter(p=>p.haji_id===hajiId).reduce((s,p)=>s+Number(p.amount),0); }
function hajiRoom(hajiId, leg){
  const ra = state.roomAssignments.find(a => a.haji_id===hajiId && state.rooms.find(r=>r.id===a.room_id)?.hotel_leg===leg);
  return ra ? state.rooms.find(r=>r.id===ra.room_id) : null;
}
// Batch lookup builders: O(n) to build once per render pass, then O(1) per row —
// avoids the O(n^2) blowup of calling hajiRoom/hajiPaid/hajiBus inside a per-haji loop.
function hajiPaidMap(){
  const map = new Map();
  for(const p of state.payments) map.set(p.haji_id, (map.get(p.haji_id)||0) + Number(p.amount));
  return map;
}
function hajiRoomMap(){
  const roomsById = new Map(state.rooms.map(r=>[r.id, r]));
  const map = new Map();
  for(const a of state.roomAssignments){
    const room = roomsById.get(a.room_id);
    if(room) map.set(`${a.haji_id}|${room.hotel_leg}`, room);
  }
  return map;
}
function hajiBusMap(){
  const busesById = new Map(state.buses.map(b=>[b.id, b]));
  const map = new Map();
  for(const a of state.busAssignments){
    const bus = busesById.get(a.bus_id);
    if(bus) map.set(a.haji_id, bus);
  }
  return map;
}
function roomOccupants(roomId){ return state.roomAssignments.filter(a=>a.room_id===roomId).map(a=>hajiById(a.haji_id)).filter(Boolean); }
function busOccupants(busId){ return state.busAssignments.filter(a=>a.bus_id===busId).map(a=>hajiById(a.haji_id)).filter(Boolean); }
function hajiBus(hajiId){
  const ba = state.busAssignments.find(a=>a.haji_id===hajiId);
  return ba ? state.buses.find(b=>b.id===ba.bus_id) : null;
}
function busTripLabel(bus){
  if(!bus || bus.leg!=='ziyarat') return null;
  return state.tripTypes.find(t=>t.id===bus.trip_type_id)?.name || null;
}
function hajisForTrip(tripTypeId){
  const paidPaymentIds = new Set(state.paymentTripItems.filter(pti=>pti.trip_type_id===tripTypeId).map(pti=>pti.payment_id));
  const hajiIds = new Set(state.payments.filter(p=>paidPaymentIds.has(p.id)).map(p=>p.haji_id));
  return state.hajis.filter(h=>hajiIds.has(h.id));
}
function busRemainingCapacity(bus){
  return bus.capacity - busOccupants(bus.id).length - (bus.helper_staff_id?1:0);
}
function familyBusSplit(familyCode, tripTypeId, excludeBusId){
  if(!familyCode) return [];
  return state.buses
    .filter(b=>b.trip_type_id===tripTypeId && b.id!==excludeBusId)
    .map(b=>({ bus:b, members: busOccupants(b.id).filter(h=>h.family_code===familyCode) }))
    .filter(s=>s.members.length);
}
async function assignFamilyToBus(busId, familyCode){
  if(!requireOnline()) return;
  const bus = state.buses.find(b=>b.id===busId);
  const pool = bus.trip_type_id ? hajisForTrip(bus.trip_type_id) : state.hajis;
  const familyHajis = familyCode ? pool.filter(h=>h.family_code===familyCode) : [];
  const alreadyOn = new Set(busOccupants(busId).map(h=>h.id));
  const toAssign = familyHajis.filter(h=>!alreadyOn.has(h.id));
  if(!toAssign.length){ showNotice('Everyone in this family is already on this bus.', 'success'); return; }
  const remaining = busRemainingCapacity(bus);
  if(toAssign.length > remaining){
    const alternatives = bus.trip_type_id
      ? state.buses.filter(b=>b.id!==bus.id && b.trip_type_id===bus.trip_type_id && busRemainingCapacity(b)>=toAssign.length)
      : [];
    const altText = alternatives.length
      ? ` Other buses with room for the whole family: ${alternatives.map(b=>`${b.bus_number} (${busRemainingCapacity(b)} left)`).join(', ')}.`
      : ' No other bus for this trip currently has room for the whole family either — you may need to split them.';
    showNotice(`Only ${remaining} of ${toAssign.length} seat${toAssign.length===1?'':'s'} left on Bus ${bus.bus_number} for this family.${altText}`, 'error');
    return;
  }
  const { error } = await sb.from('bus_assignments').insert(toAssign.map(h=>({bus_id:busId, haji_id:h.id})));
  if(error){ showNotice(error.message, 'error'); return; }
  await loadGroupData();
  openModal('assignBus', {busId});
  showNotice(`Assigned all ${toAssign.length} family member${toAssign.length===1?'':'s'} to Bus ${bus.bus_number}.`, 'success');
}

// ---------- NOTICE (toast notifications, replaces native alert()) ----------
let toastCounter = 0;
function showNotice(message, kind){
  reenablePendingButtons(); // any blocked/errored save action is done trying — free up its button
  const root = document.getElementById('notice-root');
  if(!root) return;
  const id = `toast-${++toastCounter}`;
  const el = document.createElement('div');
  el.id = id;
  el.className = `toast ${kind==='error'?'error':kind==='success'?'success':''}`;
  el.innerHTML = `<div style="flex:1;">${esc(message)}</div><button class="toast-close" onclick="closeNotice('${id}')" aria-label="Dismiss">&times;</button>`;
  root.appendChild(el);
  setTimeout(()=>closeNotice(id), kind==='error' ? 6000 : 3500);
}
function closeNotice(id){
  const root = document.getElementById('notice-root');
  if(!root) return;
  const targets = id ? [document.getElementById(id)].filter(Boolean) : [...root.children];
  targets.forEach(el=>{
    el.classList.add('leaving');
    setTimeout(()=>el.remove(), 180);
  });
}

function customSelectHtml({ name, id, options, value, placeholder, onChange, required, disabled, searchable }){
  options = options || [];
  if(value===undefined || value===null || value===''){
    if(!placeholder && options.length) value = options[0].value;
  }
  const selected = options.find(o=>String(o.value)===String(value));
  const label = selected ? selected.label : (placeholder || 'Select…');
  const idAttr = id ? ` id="${esc(id)}"` : '';
  const nameAttr = name ? ` name="${esc(name)}"` : '';
  const onchangeAttr = onChange ? ` onchange="${esc(onChange)}"` : '';
  const requiredAttr = required ? ' required' : '';
  return `
    <div class="cselect">
      <input type="hidden"${nameAttr}${idAttr} value="${esc(value??'')}"${onchangeAttr}${requiredAttr}/>
      <button type="button" class="cselect-trigger" ${disabled?'disabled':''}>
        <span class="cselect-label">${esc(label)}</span>
        <svg class="cselect-chevron" width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8l5 5 5-5"/></svg>
      </button>
      <div class="cselect-panel">
        ${searchable===false ? '' : `<input type="text" class="cselect-search" placeholder="Search…"/>`}
        <div class="cselect-options">
          ${options.map(o=>`<div class="cselect-option ${String(o.value)===String(value)?'selected':''}" data-value="${esc(o.value)}" data-label="${esc(String(o.label).toLowerCase())}">${esc(o.label)}</div>`).join('') || '<div class="cselect-empty">No options</div>'}
        </div>
        <div class="cselect-no-match" hidden>No matches</div>
      </div>
    </div>
  `;
}

const CDATE_MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const CDATE_WEEKDAYS = ['Su','Mo','Tu','We','Th','Fr','Sa'];

function formatDateDisplay(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-').map(Number);
  if(!y||!m||!d) return iso;
  return new Date(y, m-1, d).toLocaleDateString(undefined, {year:'numeric', month:'short', day:'numeric'});
}

function customDateHtml({ name, id, value, placeholder, onChange, required }){
  const idAttr = id ? ` id="${esc(id)}"` : '';
  const nameAttr = name ? ` name="${esc(name)}"` : '';
  const onchangeAttr = onChange ? ` onchange="${esc(onChange)}"` : '';
  const requiredAttr = required ? ' required' : '';
  const label = value ? formatDateDisplay(value) : (placeholder || 'Select date');
  return `
    <div class="cdate">
      <input type="hidden"${nameAttr}${idAttr} value="${esc(value||'')}"${onchangeAttr}${requiredAttr}/>
      <button type="button" class="cdate-trigger">
        <span class="cdate-label" data-placeholder="${esc(placeholder||'Select date')}">${esc(label)}</span>
        <svg class="cdate-icon" width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="14" height="12" rx="1.6"/><line x1="3" y1="8.5" x2="17" y2="8.5"/><line x1="6.5" y1="2.5" x2="6.5" y2="6"/><line x1="13.5" y1="2.5" x2="13.5" y2="6"/></svg>
      </button>
      <div class="cdate-panel"></div>
    </div>
  `;
}

function closeAllCSelects(){ document.querySelectorAll('.cselect.open').forEach(w=>w.classList.remove('open')); }
function closeAllCDates(){ document.querySelectorAll('.cdate.open').forEach(w=>w.classList.remove('open')); }

function filterCSelectOptions(wrap, query){
  const q = query.trim().toLowerCase();
  let anyVisible = false;
  wrap.querySelectorAll('.cselect-option').forEach(opt=>{
    const match = !q || (opt.getAttribute('data-label')||'').includes(q);
    opt.style.display = match ? '' : 'none';
    if(match) anyVisible = true;
  });
  const noMatch = wrap.querySelector('.cselect-no-match');
  if(noMatch) noMatch.hidden = anyVisible;
}

function renderCDateGrid(wrap, year, month){
  const panel = wrap.querySelector('.cdate-panel');
  const hidden = wrap.querySelector('input[type=hidden]');
  const selectedIso = hidden.value;
  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const todayIso = new Date().toISOString().slice(0,10);
  let cells = '';
  for(let i=0;i<firstDay;i++) cells += `<div class="cdate-cell empty"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const iso = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const cls = ['cdate-cell'];
    if(iso===selectedIso) cls.push('selected');
    if(iso===todayIso) cls.push('today');
    cells += `<div class="${cls.join(' ')}" data-date="${iso}">${d}</div>`;
  }
  panel.setAttribute('data-view', `${year}-${month}`);
  panel.innerHTML = `
    <div class="cdate-header">
      <button type="button" class="cdate-nav cdate-prev" aria-label="Previous month">‹</button>
      <span class="cdate-month-label">${CDATE_MONTHS[month]} ${year}</span>
      <button type="button" class="cdate-nav cdate-next" aria-label="Next month">›</button>
    </div>
    <div class="cdate-weekdays">${CDATE_WEEKDAYS.map(w=>`<div class="cdate-weekday">${w}</div>`).join('')}</div>
    <div class="cdate-grid">${cells}</div>
    <div class="cdate-footer">
      <button type="button" class="ghost cdate-today" style="flex:1;">Today</button>
      <button type="button" class="ghost cdate-clear" style="flex:1;">Clear</button>
    </div>
  `;
}

function openCDatePanel(wrap){
  const hidden = wrap.querySelector('input[type=hidden]');
  const iso = hidden.value;
  let y, m;
  if(iso){ const parts = iso.split('-').map(Number); y = parts[0]; m = parts[1]-1; }
  else { const now = new Date(); y = now.getFullYear(); m = now.getMonth(); }
  renderCDateGrid(wrap, y, m);
}

document.addEventListener('click', (e)=>{
  const trigger = e.target.closest('.cselect-trigger');
  if(trigger){
    const wrap = trigger.closest('.cselect');
    const isOpen = wrap.classList.contains('open');
    closeAllCSelects(); closeAllCDates();
    if(!isOpen){
      wrap.classList.add('open');
      const search = wrap.querySelector('.cselect-search');
      if(search){ search.value=''; filterCSelectOptions(wrap, ''); search.focus(); }
    }
    return;
  }
  const option = e.target.closest('.cselect-option');
  if(option){
    const wrap = option.closest('.cselect');
    const hidden = wrap.querySelector('input[type=hidden]');
    const newValue = option.getAttribute('data-value');
    if(hidden.value !== newValue){
      hidden.value = newValue;
      hidden.dispatchEvent(new Event('change', {bubbles:true}));
    }
    wrap.querySelectorAll('.cselect-option.selected').forEach(o=>o.classList.remove('selected'));
    option.classList.add('selected');
    wrap.querySelector('.cselect-label').textContent = option.textContent;
    wrap.classList.remove('open');
    return;
  }
  const dtrigger = e.target.closest('.cdate-trigger');
  if(dtrigger){
    const wrap = dtrigger.closest('.cdate');
    const isOpen = wrap.classList.contains('open');
    closeAllCSelects(); closeAllCDates();
    if(!isOpen){
      wrap.classList.add('open');
      openCDatePanel(wrap);
    }
    return;
  }
  const daycell = e.target.closest('.cdate-cell:not(.empty)');
  if(daycell){
    const wrap = daycell.closest('.cdate');
    const hidden = wrap.querySelector('input[type=hidden]');
    const iso = daycell.getAttribute('data-date');
    if(hidden.value !== iso){
      hidden.value = iso;
      hidden.dispatchEvent(new Event('change', {bubbles:true}));
    }
    wrap.querySelector('.cdate-label').textContent = formatDateDisplay(iso);
    wrap.classList.remove('open');
    return;
  }
  const navBtn = e.target.closest('.cdate-nav');
  if(navBtn){
    const wrap = navBtn.closest('.cdate');
    const panel = wrap.querySelector('.cdate-panel');
    let [y,m] = panel.getAttribute('data-view').split('-').map(Number);
    m += navBtn.classList.contains('cdate-next') ? 1 : -1;
    if(m<0){ m=11; y--; } if(m>11){ m=0; y++; }
    renderCDateGrid(wrap, y, m);
    return;
  }
  const todayBtn = e.target.closest('.cdate-today');
  if(todayBtn){
    const wrap = todayBtn.closest('.cdate');
    const hidden = wrap.querySelector('input[type=hidden]');
    const iso = new Date().toISOString().slice(0,10);
    hidden.value = iso;
    hidden.dispatchEvent(new Event('change', {bubbles:true}));
    wrap.querySelector('.cdate-label').textContent = formatDateDisplay(iso);
    wrap.classList.remove('open');
    return;
  }
  const clearBtn = e.target.closest('.cdate-clear');
  if(clearBtn){
    const wrap = clearBtn.closest('.cdate');
    const hidden = wrap.querySelector('input[type=hidden]');
    hidden.value = '';
    hidden.dispatchEvent(new Event('change', {bubbles:true}));
    const labelEl = wrap.querySelector('.cdate-label');
    labelEl.textContent = labelEl.getAttribute('data-placeholder') || 'Select date';
    wrap.classList.remove('open');
    return;
  }
  if(!e.target.closest('.cselect')) closeAllCSelects();
  if(!e.target.closest('.cdate')) closeAllCDates();
});

document.addEventListener('input', (e)=>{
  if(e.target.classList.contains('cselect-search')){
    filterCSelectOptions(e.target.closest('.cselect'), e.target.value);
  }
});

document.addEventListener('keydown', (e)=>{
  if(e.key==='Escape'){ closeAllCSelects(); closeAllCDates(); }
});

        ${sections.includes('bus') ? `
          <div class="card" style="margin-bottom:14px;">
            <h3 style="margin-bottom:6px;">Bus assignment</h3>
            ${state.myBusAssignments.length ? state.myBusAssignments.map(a=>`<p>Bus ${esc(a.buses?.bus_number||'—')} · ${(a.buses?.leg||'').replace('_',' ')}${a.buses?.trip_types?.name?` · ${esc(a.buses.trip_types.name)}`:''}</p>`).join('') : `<p style="color:#8a8168;">Not assigned yet.</p>`}

    </div>
  `;
}

function hotelFieldHtml(leg, currentValue, isNew){
  const list = hotelsForLeg(leg);
  const matched = list.find(h=>h.name===currentValue);
  let selectValue;
  if(currentValue){
    selectValue = matched ? matched.id : 'other';
  } else if(isNew){
    const def = list.find(h=>h.is_default);
    selectValue = def ? def.id : 'other';
  } else {
    selectValue = 'other';
  }
  const showOther = selectValue === 'other';
  const options = [
    ...list.map(h=>({value:h.id, label: h.name + (h.is_default?' (default)':'')})),
    {value:'other', label:'Other (type manually)'}
  ];
  return `
    <div class="hotel-field-wrap">
      ${customSelectHtml({
        name: `${leg}_hotel_select`,
        options, value: selectValue,
        placeholder: `— Select ${leg==='mecca'?'Mecca':'Madinah'} hotel —`,
        onChange: 'toggleHotelOther(this)'

function toggleHotelOther(sel){

function parseCsvLine(line){
  const cells = [];
  let cur = '', inQuotes = false;
  for(let i=0;i<line.length;i++){
    const c = line[i];
    if(inQuotes){
      if(c === '"'){
        if(line[i+1] === '"'){ cur += '"'; i++; }
        else inQuotes = false;
      } else cur += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ','){ cells.push(cur); cur=''; }
      else cur += c;
    }
  }
  cells.push(cur);
  return cells.map(s=>s.trim());
}

const BULK_IMPORT_ENTITY_LABELS = {
  hajis: 'Hajis (pilgrims)',
  rooms: 'Rooms',
  buses: 'Buses',
  hotels: 'Hotels',
  tripTypes: 'Ziyarat trip types',
  packages: 'Packages'
};
const BULK_IMPORT_GROUP_SCOPED = new Set(['hajis','rooms','buses','tripTypes','packages']);

function handleCsvFileUpload(input){
  const file = input.files?.[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    document.getElementById('csv-text').value = String(reader.result||'').trim();
    document.getElementById('csv-has-header').checked = true;
  };

}

}

function stripTempKeys(row){
  return Object.fromEntries(Object.entries(row).filter(([k])=>!k.startsWith('_')));
}

async function bulkImportCSV(entity, groupId){
  entity = entity || 'hajis';
  const def = BULK_IMPORT_DEFS[entity];
  const text = document.getElementById('csv-text').value.trim();
  if(!text || !def) return;

  const totalSteps = entity==='hajis' ? 5 : entity==='buses' ? 2 : 1;
  const importBtn = document.getElementById('bulk-import-btn');
  const cancelBtn = document.getElementById('bulk-import-cancel-btn');
  if(importBtn){ importBtn.disabled = true; importBtn.textContent = 'Importing…'; }
  if(cancelBtn) cancelBtn.disabled = true;
  updateImportProgress(0, totalSteps, 'Reading file…');

  let rawLines = text.split('\n').map(l=>l.trim()).filter(Boolean);
  if(document.getElementById('csv-has-header')?.checked) rawLines = rawLines.slice(1);
  // A haji sheet where every row names its own Group doesn't need a fallback group created.
  const needsFallbackGroup = entity!=='hajis' || rawLines.some(line=>{
    const p = def.parse(line, null);
    return p && !p._groupName;
  });

  if(BULK_IMPORT_GROUP_SCOPED.has(entity) && !groupId && needsFallbackGroup){
    const typedName = document.getElementById('bulk-import-group-name')?.value.trim();
    const newGroupName = typedName || `Imported Group — ${new Date().toLocaleString()}`;
    const existingGroup = state.groups.find(g=>g.name.toLowerCase()===newGroupName.toLowerCase());
    if(existingGroup){
      groupId = existingGroup.id;
    } else {
      const { data: newGroup, error: groupErr } = await sb.from('groups').insert({name:newGroupName}).select().single();
      if(groupErr){ resetImportProgress(); showNotice(groupErr.message, 'error'); return; }
      groupId = newGroup.id;
      state.groups.push(newGroup);
    }
    state.activeGroupId = groupId;
    await loadGroupData();
  }

  const parsed = rawLines.map(line=>def.parse(line, groupId)).filter(Boolean);
  let rows = parsed.map(stripTempKeys);

  if(rows.length){
    if(entity==='hajis'){
      updateImportProgress(0, totalSteps, 'Resolving groups…');
      // Resolve/create a Group per unique group name in the sheet (falls back to the batch group when blank).
      // Batched: one insert for every missing group, instead of one round trip per row.
      const groupCache = new Map(state.groups.map(g=>[g.name.toLowerCase(), g]));
      const missingGroupNames = new Map();
      for(const p of parsed){
        if(!p._groupName) continue;
        const key = p._groupName.toLowerCase();
        if(!groupCache.has(key) && !missingGroupNames.has(key)) missingGroupNames.set(key, p._groupName);
      }
      if(missingGroupNames.size){
        const { data: newGroups, error: gErr } = await sb.from('groups').insert([...missingGroupNames.values()].map(name=>({name}))).select();
        if(gErr){ resetImportProgress(); showNotice(gErr.message, 'error'); return; }
        for(const g of (newGroups||[])){ groupCache.set(g.name.toLowerCase(), g); state.groups.push(g); }
      }
      for(const p of parsed){
        p._resolvedGroupId = p._groupName ? (groupCache.get(p._groupName.toLowerCase())?.id || groupId) : groupId;
      }

      updateImportProgress(1, totalSteps, 'Resolving rooms…');
      // Resolve/create a Room per unique (group, room number) pair.
      // Batched: one query covering every involved group, one insert for everything missing.
      const roomCache = new Map();
      const involvedGroupIds = [...new Set(parsed.filter(p=>p._roomNumber && p._resolvedGroupId).map(p=>p._resolvedGroupId))];
      if(involvedGroupIds.length){
        const { data: existingRooms } = await sb.from('rooms').select('*').in('group_id', involvedGroupIds);
        for(const r of (existingRooms||[])) roomCache.set(`${r.group_id}|${r.room_number.toLowerCase()}`, r);
      }
      const missingRooms = new Map();
      for(const p of parsed){
        if(!p._roomNumber || !p._resolvedGroupId) continue;
        const key = `${p._resolvedGroupId}|${p._roomNumber.toLowerCase()}`;
        if(!roomCache.has(key) && !missingRooms.has(key)){
          missingRooms.set(key, { group_id: p._resolvedGroupId, hotel_leg:'mecca', room_number: p._roomNumber, capacity:4, gender:'family' });
        }
      }
      if(missingRooms.size){
        const { data: newRooms, error: roomErr } = await sb.from('rooms').insert([...missingRooms.values()]).select();
        if(roomErr){ resetImportProgress(); showNotice(roomErr.message, 'error'); return; }
        for(const r of (newRooms||[])){ roomCache.set(`${r.group_id}|${r.room_number.toLowerCase()}`, r); if(r.group_id===state.activeGroupId) state.rooms.push(r); }
      }

      updateImportProgress(2, totalSteps, 'Resolving packages…');
      // Resolve/create a Package per unique (group, package name) pair. Same batched pattern.
      const packageCache = new Map();
      const involvedPackageGroupIds = [...new Set(parsed.filter(p=>p._packageName && p._resolvedGroupId).map(p=>p._resolvedGroupId))];
      if(involvedPackageGroupIds.length){
        const { data: existingPackages } = await sb.from('packages').select('*').in('group_id', involvedPackageGroupIds);
        for(const x of (existingPackages||[])) packageCache.set(`${x.group_id}|${x.name.toLowerCase()}`, x);
      }
      const missingPackages = new Map();
      for(const p of parsed){
        if(!p._packageName || !p._resolvedGroupId) continue;
        const key = `${p._resolvedGroupId}|${p._packageName.toLowerCase()}`;
        if(!packageCache.has(key) && !missingPackages.has(key)){
          missingPackages.set(key, { group_id: p._resolvedGroupId, name: p._packageName, price: 0 });
        }
      }
      if(missingPackages.size){
        const { data: newPackages, error: pkgErr } = await sb.from('packages').insert([...missingPackages.values()]).select();
        if(pkgErr){ resetImportProgress(); showNotice(pkgErr.message, 'error'); return; }
        for(const x of (newPackages||[])){ packageCache.set(`${x.group_id}|${x.name.toLowerCase()}`, x); if(x.group_id===state.activeGroupId) state.packages.push(x); }
      }

      updateImportProgress(3, totalSteps, 'Saving pilgrims…');
      rows = parsed.map(p=>({
        ...stripTempKeys(p),
        group_id: p._resolvedGroupId,
        package_id: p._packageName && p._resolvedGroupId ? (packageCache.get(`${p._resolvedGroupId}|${p._packageName.toLowerCase()}`)?.id||null) : null
      }));
      const { data, error } = await sb.from(def.table).insert(rows).select();
      if(error){ resetImportProgress(); showNotice(error.message, 'error'); return; }

      updateImportProgress(4, totalSteps, 'Assigning rooms…');
      const assignments = [];
      for(let i=0; i<(data||[]).length; i++){
        const p = parsed[i];
        if(!p._roomNumber || !p._resolvedGroupId) continue;
        const room = roomCache.get(`${p._resolvedGroupId}|${p._roomNumber.toLowerCase()}`);
        if(room) assignments.push({ room_id: room.id, haji_id: data[i].id });
      }
      if(assignments.length) await sb.from('room_assignments').insert(assignments);
      updateImportProgress(5, totalSteps, 'Done');
    } else if(entity==='buses'){
      updateImportProgress(0, totalSteps, 'Resolving trip types…');
      const tripCache = new Map(state.tripTypes.map(t=>[t.name.toLowerCase(), t]));
      for(const p of parsed){
        if(!p._tripName || tripCache.has(p._tripName.toLowerCase())) continue;
        const { data: newTrip, error: tripErr } = await sb.from('trip_types').insert({ group_id: groupId, name: p._tripName, price_adult:0, price_child:0 }).select().single();
        if(tripErr || !newTrip) continue;
        tripCache.set(p._tripName.toLowerCase(), newTrip);
        state.tripTypes.push(newTrip);
      }
      updateImportProgress(1, totalSteps, 'Saving buses…');
      rows = parsed.map(p=>({ ...stripTempKeys(p), trip_type_id: p._tripName ? (tripCache.get(p._tripName.toLowerCase())?.id||null) : null }));
      const { error } = await sb.from(def.table).insert(rows);
      if(error){ resetImportProgress(); showNotice(error.message, 'error'); return; }
      updateImportProgress(2, totalSteps, 'Done');
    } else {
      updateImportProgress(0, totalSteps, 'Saving records…');
      const { error } = await sb.from(def.table).insert(rows);
      if(error){ resetImportProgress(); showNotice(error.message, 'error'); return; }
      updateImportProgress(1, totalSteps, 'Done');
    }
  }
  if(entity==='hotels'){
    const { data } = await sb.from('hotels').select('*').order('name');
    state.hotels = data || [];
  } else if(state.activeGroupId){
    await loadGroupData();
  }
  closeModal();
  showNotice(`Imported ${rows.length} ${BULK_IMPORT_ENTITY_LABELS[entity]||entity} record${rows.length===1?'':'s'}.`, 'success');
  render();
}

    const total = occ.length + (helper?1:0);

    const trip = leg==='ziyarat' ? state.tripTypes.find(t=>t.id===b.trip_type_id) : null;
    return `<div class="card">
      <div style="display:flex;justify-content:space-between;">
        <strong>Bus ${esc(b.bus_number)}</strong>
        <span class="pill ${over?'bad':'ok'}">${total}/${b.capacity}</span>
      </div>
      ${trip ? `<div style="margin:4px 0;"><span class="pill warn">${esc(trip.name)}</span></div>` : ''}

      <div class="capacity-bar"><div class="capacity-fill ${over?'over':''}" style="width:${Math.min(100,total/b.capacity*100)}%"></div></div>
      <button class="ghost" style="margin-top:10px;width:100%;" onclick="openModal('assignBus',{busId:'${b.id}'})" ${can('manageBuses')?'':'disabled'}>Assign pilgrims</button>

        <div style="display:flex;gap:8px;margin-top:8px;">

    reference: '',
  };
  state.view = 'tripCollector';
  state.mobileNavOpen = false;
  render();

function addHajiToCollector(hajiId){
  const tc = state.tripCollector;
  if(!tc.selectedIds.includes(hajiId)){
    tc.selectedIds.push(hajiId);
    tc.perHaji[hajiId] = { foc:false, trips:{} };
  }
}
function addRoomToCollector(){
  const roomId = document.getElementById('collector-room').value;
  if(!roomId) return;
  roomOccupants(roomId).forEach(h=>addHajiToCollector(h.id));
  render();
}
function searchIndividualForCollector(){
  const q = (document.getElementById('collector-search').value||'').trim().toLowerCase();
  if(!q) return;
  const matches = state.hajis.filter(h=>
    (h.full_name||'').toLowerCase().includes(q) ||
    (h.passport_no||'').toLowerCase().includes(q) ||
    (h.family_code||'').toLowerCase().includes(q)
  );
  if(!matches.length){ showNotice('No matching customer found.', 'error'); return; }
  matches.forEach(h=>addHajiToCollector(h.id));
  render();
}
function removeFromCollector(hajiId){
  const tc = state.tripCollector;
  tc.selectedIds = tc.selectedIds.filter(id=>id!==hajiId);
  delete tc.perHaji[hajiId];
  render();
}

  state.tripCollector.perHaji[hajiId].trips[tripTypeId] = checked;

}
function toggleCollectorFOC(hajiId, checked){
  state.tripCollector.perHaji[hajiId].foc = checked;

function toggleTemplateTrip(tripTypeId, checked){
  state.tripCollector.template[tripTypeId] = checked;

}

  tc.selectedIds.forEach(id=>{ tc.perHaji[id].trips = {...tc.template}; });

function markAllFOC(){
  const tc = state.tripCollector;

async function saveTripPayments(){
  if(!requireOnline()) return;
  const tc = state.tripCollector;
  const eligibleIds = collectorEligibleIds();
  if(!eligibleIds.length){ showNotice('Select at least one trip (or mark FOC) for at least one customer.', 'error'); return; }
  for(const hajiId of eligibleIds){
    const ph = tc.perHaji[hajiId];
    const checkedTrips = state.tripTypes.filter(t=>ph.trips[t.id]);
    const amount = ph.foc ? 0 : checkedTrips.reduce((s,t)=>s+priceForHaji(t, hajiId),0);
    const { data: paymentRow, error } = await sb.from('payments').insert({
      haji_id: hajiId, amount,
      method: tc.method, paid_on: tc.paidOn || new Date().toISOString().slice(0,10),
      reference: tc.reference, notes: ph.foc ? 'FOC — trips waived' : ''
    }).select().single();
    if(error){ showNotice(error.message, 'error'); return; }
    if(checkedTrips.length){
      const items = checkedTrips.map(t=>({ payment_id: paymentRow.id, trip_type_id: t.id, trip_name: t.name, price: ph.foc?0:priceForHaji(t, hajiId), is_foc: ph.foc }));
      await sb.from('payment_trip_items').insert(items);
    }
  }
  const count = eligibleIds.length;
  state.tripCollector = { selectedIds: [], perHaji: {}, template: {}, method: tc.method, paidOn: tc.paidOn, reference: '' };
  await loadGroupData();
  showNotice(`Saved payments for ${count} customer${count===1?'':'s'}.`, 'success');
  render();
}

function reportRows(filter){
  return state.paymentTripItems.map(item=>{
    const payment = state.payments.find(p=>p.id===item.payment_id);
    if(!payment) return null;
    if(filter.dateFrom && payment.paid_on < filter.dateFrom) return null;
    if(filter.dateTo && payment.paid_on > filter.dateTo) return null;
    const haji = hajiById(payment.haji_id);
    return { ...item, paidOn: payment.paid_on, category: ageCategory(haji?.age) };
  }).filter(Boolean);
}
function orderedTripNames(rows){
  const names = [...new Set(rows.map(r=>r.trip_name))];
  return [
    ...state.tripTypes.map(t=>t.name).filter(n=>names.includes(n)),
    ...names.filter(n=>!state.tripTypes.some(t=>t.name===n)),
  ];
}
function renderReportByTrip(rows){
  const names = orderedTripNames(rows);
  return `<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(320px,1fr));align-items:start;">
    ${names.map(name=>{
      const group = rows.filter(r=>r.trip_name===name);
      const catRows = REPORT_CATEGORIES.map(cat=>({
        cat,
        paid: group.filter(r=>r.category===cat && !r.is_foc).length,
        foc: group.filter(r=>r.category===cat && r.is_foc).length,
      }));
      const paidSubtotal = catRows.reduce((s,c)=>s+c.paid,0);
      const focSubtotal = catRows.reduce((s,c)=>s+c.foc,0);
      return `
        <div class="card table-wrap">
          <table>
            <thead><tr><th>Category</th><th>${esc(name)} Paid</th><th>${esc(name)} FOC</th></tr></thead>
            <tbody>
              ${catRows.map(c=>`<tr><td>${c.cat}</td><td>${c.paid}</td><td>${c.foc}</td></tr>`).join('')}
              <tr><td><strong>Subtotal</strong></td><td><strong>${paidSubtotal}</strong></td><td><strong>${focSubtotal}</strong></td></tr>
              <tr><td><strong>Total</strong></td><td colspan="2"><strong>${paidSubtotal+focSubtotal}</strong></td></tr>
            </tbody>
          </table>
        </div>
      `;
    }).join('')}
  </div>`;
}
function renderReportByDate(rows){
  const dates = [...new Set(rows.map(r=>r.paidOn))].sort((a,b)=>b.localeCompare(a));
  return dates.map(date=>{
    const dayRows = rows.filter(r=>r.paidOn===date);
    const names = orderedTripNames(dayRows);
    const tripRows = names.map(name=>{
      const group = dayRows.filter(r=>r.trip_name===name);
      const paid = group.filter(r=>!r.is_foc).length;
      const foc = group.filter(r=>r.is_foc).length;
      const amount = group.reduce((s,r)=>s+(r.is_foc?0:Number(r.price||0)),0);
      return { name, paid, foc, total: paid+foc, amount };
    });
    const dayTotalCount = tripRows.reduce((s,t)=>s+t.total,0);
    const dayTotalAmount = tripRows.reduce((s,t)=>s+t.amount,0);
    return `
      <div class="card table-wrap" style="margin-bottom:16px;">
        <h3 style="margin-bottom:10px;">${date}</h3>
        <table>
          <thead><tr><th>Trip</th><th>Paid</th><th>FOC</th><th>Total</th><th>Amount</th></tr></thead>
          <tbody>
            ${tripRows.map(t=>`<tr><td>${esc(t.name)}</td><td data-label="Paid">${t.paid}</td><td data-label="FOC">${t.foc}</td><td data-label="Total">${t.total}</td><td data-label="Amount">${fmt(t.amount)}</td></tr>`).join('')}
            <tr><td colspan="3"><strong>Day total</strong></td><td data-label="Total"><strong>${dayTotalCount}</strong></td><td data-label="Amount"><strong>${fmt(dayTotalAmount)}</strong></td></tr>
          </tbody>
        </table>
      </div>
    `;
  }).join('');
}

  const input = document.getElementById('delete-group-confirm-input');
  const btn = document.getElementById('delete-group-confirm-btn');
  if(!group || !input || !btn) return;
  btn.disabled = input.value.trim() !== group.name;
}
async function deleteGroupPermanently(groupId){
  if(state.myRole!=='super_admin'){ showNotice('Only a Qibla Owner can do this.', 'error'); return; }
  if(!requireOnline()) return;
  const group = state.groups.find(g=>g.id===groupId);
  if(!group) return;
  const { error: hajiErr } = await sb.from('hajis').delete().eq('group_id', groupId);
  if(hajiErr){ showNotice(hajiErr.message, 'error'); return; }
  const { error: tripErr } = await sb.from('trip_types').delete().eq('group_id', groupId);
  if(tripErr){ showNotice(tripErr.message, 'error'); return; }
  const { error: groupErr } = await sb.from('groups').delete().eq('id', groupId);
  if(groupErr){ showNotice(groupErr.message, 'error'); return; }
  closeModal();
  if(state.activeGroupId === groupId) state.activeGroupId = null;
  await loadAll();
  showNotice(`"${group.name}" and all its data have been permanently deleted.`, 'success');
}

  const input = document.getElementById('delete-all-confirm-input');
  const btn = document.getElementById('delete-all-confirm-btn');
  if(!input || !btn) return;
  btn.disabled = input.value.trim() !== DELETE_ALL_CONFIRM_PHRASE;
}
async function deleteEntireDatabase(){
  if(state.myRole!=='super_admin'){ showNotice('Only a Qibla Owner can do this.', 'error'); return; }
  if(!requireOnline()) return;
  for(const group of [...state.groups]){
    const { error: hajiErr } = await sb.from('hajis').delete().eq('group_id', group.id);
    if(hajiErr){ showNotice(hajiErr.message, 'error'); return; }
    const { error: tripErr } = await sb.from('trip_types').delete().eq('group_id', group.id);
    if(tripErr){ showNotice(tripErr.message, 'error'); return; }
    const { error: groupErr } = await sb.from('groups').delete().eq('id', group.id);
    if(groupErr){ showNotice(groupErr.message, 'error'); return; }
  }
  for(const hotel of [...state.hotels]){
    const { error: hotelErr } = await sb.from('hotels').delete().eq('id', hotel.id);
    if(hotelErr){ showNotice(hotelErr.message, 'error'); return; }
  }
  closeModal();
  state.activeGroupId = null;
  await loadAll();
  showNotice('The entire database has been permanently wiped.', 'success');
}
async function toggleHajiSection(key, checked){
  const rs = state.roleSettings.find(r=>r.role==='haji');
  let visible = rs?.visible_views ? [...rs.visible_views] : HAJI_SECTION_DEFS.map(d=>d.key);
  if(checked){ if(!visible.includes(key)) visible.push(key); }
  else { visible = visible.filter(k=>k!==key); }
  await upsertRoleSettings('haji', { visible_views: visible });
}
async function upsertRoleSettings(role, patch){
  const existing = state.roleSettings.find(r=>r.role===role);
  const payload = { role, default_view: existing?.default_view||'dashboard', visible_views: existing?.visible_views||null, ...patch };
  const { data, error } = await sb.from('role_settings').upsert(payload, {onConflict:'role'}).select().single();
  if(error){ showNotice(error.message, 'error'); return; }
  const idx = state.roleSettings.findIndex(r=>r.role===role);
  if(idx>=0) state.roleSettings[idx] = data; else state.roleSettings.push(data);
  render();
}
async function updateRoleDefaultView(role, view){
  await upsertRoleSettings(role, { default_view: view });
}
async function toggleRoleVisibleItem(role, key, checked){
  const permitted = permittedNavItems(role).map(d=>d.key);
  const rs = state.roleSettings.find(r=>r.role===role);
  let visible = rs?.visible_views ? [...rs.visible_views] : [...permitted];
  if(checked){ if(!visible.includes(key)) visible.push(key); }
  else { visible = visible.filter(k=>k!==key); }
  await upsertRoleSettings(role, { visible_views: visible });
}
