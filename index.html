      <p style="font-size:12px;color:#6b6252;">Priced trips for this group (e.g. Hira, Taif, Jeddah, Meeqat) used by the trip payment collector. Under 5s always ride free.</p>
      <div class="assign-list" style="margin:10px 0 14px;">
        ${state.tripTypes.map(t=>`<div class="assign-row"><span>${esc(t.name)} — Adult ${fmt(t.price_adult)} · Child (5-9) ${fmt(t.price_child)} · Under 5 free</span><button class="danger" onclick="deleteTripType('${t.id}')">Remove</button></div>`).join('') || '<div class="empty">No trip types yet</div>'}
      </div>
      <div class="field"><input id="trip-type-name" placeholder="e.g. Hira"/></div>
      <div class="two-col">
        <input id="trip-type-price-adult" type="number" step="0.01" placeholder="Adult price (MVR)"/>
        <input id="trip-type-price-child" type="number" step="0.01" placeholder="Child 5-9 price (MVR)"/>
      </div>
      <div style="display:flex;gap:8px;margin-top:12px;">
        <button class="gold" style="flex:1" onclick="addTripType()">Add trip type</button>
        <button class="ghost" onclick="closeModal()">Close</button>
      </div>
    `;
  } else if(type==='hajiDetail'){
    const h = data;
    const pkg = packageById(h.package_id);
    const due = pkg?Number(pkg.price):0;
    const bal = due - hajiPaid(h.id);
    const room = hajiRoom(h.id,'mecca') || hajiRoom(h.id,'madinah');
    const bus = hajiBus(h.id);
    const detailRow = (label, value) => `<div class="detail-row"><span class="detail-label">${label}</span><span class="detail-value">${value}</span></div>`;
    body = `
      <h3>${esc(h.full_name)}</h3>
      <div style="display:flex;gap:6px;margin-bottom:12px;">
        ${h.is_elderly?'<span class="pill warn">Elderly</span>':''}
        ${h.needs_wheelchair?'<span class="pill warn">Wheelchair</span>':''}
      </div>
      <div class="detail-list">
        ${detailRow('Passport', esc(h.passport_no||'—'))}
        ${detailRow('Phone', esc(h.phone||'—'))}
        ${detailRow('Gender', titleCase(h.gender)||'—')}
        ${detailRow('Age', h.age??'—')}
        ${detailRow('Package', pkg?esc(pkg.name):'—')}
        ${detailRow('Balance', `<span class="pill ${bal<=0?'ok':'bad'}">${fmt(bal)}</span>`)}
        ${detailRow('Family code', esc(h.family_code||'—'))}
        ${detailRow('Flight number', esc(h.flight_number||'—'))}
        ${detailRow('Q number', esc(h.q_number||'—'))}
        ${detailRow('Group number', esc(h.group_number||'—'))}
        ${detailRow('Room', room?`${esc(room.room_number)} (${titleCase(room.hotel_leg)})`:'—')}
        ${detailRow('Bus', bus?`${esc(bus.bus_number)} (${titleCase(bus.leg.replace(/_/g,' '))}${busTripLabel(bus)?` · ${esc(busTripLabel(bus))}`:''})`:'—')}
        ${detailRow('Notes', esc(h.notes||'—'))}
      </div>
      <div style="display:flex;gap:8px;margin-top:16px;">
        ${can('manageHajis') ? `<button class="primary" style="flex:1" onclick="openModal('haji', hajiById('${h.id}'))">Edit</button>` : ''}
        <button class="ghost" style="flex:1" onclick="closeModal()">Close</button>
      </div>
    `;
  } else if(type==='haji'){
    body = `
      <h3>${data.id?'Edit haji':'Add haji'}</h3>
      <form onsubmit="saveHaji(event, ${data.id?`'${data.id}'`:'null'})">
        <div class="field"><label>Full name</label><input name="full_name" value="${esc(data.full_name||'')}" required/></div>
        <div class="two-col">
          <div class="field"><label>Passport no.</label><input name="passport_no" value="${esc(data.passport_no||'')}"/></div>
          <div class="field"><label>Phone</label><input name="phone" value="${esc(data.phone||'')}"/></div>
        </div>
        <div class="two-col">
          <div class="field"><label>Gender</label>
            ${customSelectHtml({ name:'gender', options:[{value:'male',label:'Male'},{value:'female',label:'Female'}], value:data.gender, searchable:false })}
          </div>
          <div class="field"><label>Age</label><input type="number" min="0" max="120" name="age" value="${data.age??''}" placeholder="e.g. 34"/></div>
        </div>
        <div class="field"><label>Package</label>
          ${customSelectHtml({
            name: 'package_id',
            options: [{value:'',label:'—'}, ...state.packages.map(p=>({value:p.id, label:`${p.name} (${fmt(p.price)})`}))],
            value: data.package_id||''
          })}
        </div>
        <div class="field"><label>Family code (group family members together)</label><input name="family_code" value="${esc(data.family_code||'')}"/></div>
        <div class="two-col">
          <div class="field"><label>Flight number</label><input name="flight_number" value="${esc(data.flight_number||'')}" placeholder="e.g. EK625"/></div>
          <div class="field"><label>Q number</label><input name="q_number" value="${esc(data.q_number||'')}" placeholder="Ministry queue no."/></div>
        </div>
        <div class="field"><label>Group number</label><input name="group_number" value="${esc(data.group_number||'')}" placeholder="Sub-group / mushrif no."/></div>
        <div class="two-col">
          <label style="display:flex;align-items:center;gap:6px;font-weight:400;text-transform:none;font-size:13px;"><input type="checkbox" name="is_elderly" style="width:auto;" ${data.is_elderly?'checked':''}/> Elderly</label>
          <label style="display:flex;align-items:center;gap:6px;font-weight:400;text-transform:none;font-size:13px;"><input type="checkbox" name="needs_wheelchair" style="width:auto;" ${data.needs_wheelchair?'checked':''}/> Needs wheelchair</label>
        </div>
        <div class="field"><label>Notes</label><input name="notes" value="${esc(data.notes||'')}"/></div>
        <div style="display:flex;gap:8px;margin-top:16px;">
          <button type="submit" class="primary" style="flex:1">Save</button>
          <button type="button" class="ghost" onclick="closeModal()">Cancel</button>
        </div>
      </form>
    `;
  } else if(type==='deleteGroupConfirm'){
    const group = state.groups.find(g=>g.id===data.groupId);
    body = group ? `
      <h3 style="color:var(--danger);">Delete "${esc(group.name)}"?</h3>
      <p style="font-size:13px;margin-bottom:12px;">This permanently deletes <strong>all hajis, rooms, buses, payments, trip types, and packages</strong> under this group. This cannot be undone.</p>
      <div class="field">
        <label>Type the group name to confirm</label>
        <input id="delete-group-confirm-input" placeholder="${esc(group.name)}" oninput="toggleDeleteGroupButton('${group.id}')"/>
      </div>
      <div style="display:flex;gap:8px;margin-top:16px;">
        <button id="delete-group-confirm-btn" class="danger" style="flex:1" disabled onclick="deleteGroupPermanently('${group.id}')">Permanently delete</button>
        <button class="ghost" onclick="closeModal()">Cancel</button>
      </div>
    ` : `<h3>Group not found</h3><button class="ghost" style="width:100%;" onclick="closeModal()">Close</button>`;
  } else if(type==='deleteAllConfirmStep1'){
    body = `
      <h3 style="color:var(--danger);">Wipe the entire database?</h3>
      <p style="font-size:13px;margin-bottom:12px;">This permanently deletes <strong>every group and everything in them</strong> — all hajis, rooms, buses, payments, trip types, and packages — plus all hotels. Staff accounts and settings are kept. This cannot be undone and affects every user.</p>
      <p style="font-size:13px;margin-bottom:12px;">Right now that's <strong>${state.groups.length} group${state.groups.length===1?'':'s'}</strong> and <strong>${state.hotels.length} hotel${state.hotels.length===1?'':'s'}</strong>.</p>
      <div style="display:flex;gap:8px;margin-top:16px;">
        <button class="danger" style="flex:1" onclick="openModal('deleteAllConfirmStep2')">I understand, continue</button>
        <button class="ghost" onclick="closeModal()">Cancel</button>
      </div>
    `;
  } else if(type==='deleteAllConfirmStep2'){
    body = `
      <h3 style="color:var(--danger);">Final confirmation</h3>
      <p style="font-size:13px;margin-bottom:12px;">Type <strong class="mono">${DELETE_ALL_CONFIRM_PHRASE}</strong> to permanently wipe the database. This is your last chance to back out.</p>
      <div class="field">
        <label>Type ${DELETE_ALL_CONFIRM_PHRASE} to confirm</label>
        <input id="delete-all-confirm-input" placeholder="${DELETE_ALL_CONFIRM_PHRASE}" oninput="toggleDeleteAllButton()"/>
      </div>
      <div style="display:flex;gap:8px;margin-top:16px;">
        <button id="delete-all-confirm-btn" class="danger" style="flex:1" disabled onclick="deleteEntireDatabase()">Permanently wipe database</button>
        <button class="ghost" onclick="closeModal()">Cancel</button>
      </div>
    `;
  } else if(type==='bulkImport'){
    const entity = data.entity || 'hajis';
    const def = BULK_IMPORT_DEFS[entity];
    const needsGroup = BULK_IMPORT_GROUP_SCOPED.has(entity) && !data.groupId;
    const otherEntities = Object.entries(BULK_IMPORT_ENTITY_LABELS).filter(([k])=>k!==entity);
    body = `
      <h3>${def.title}</h3>
      <p style="font-size:12px;color:#6b6252;">${def.hint}</p>
      ${needsGroup ? `
        <div class="field" style="margin-top:14px;">
          <label>New group name (optional)</label>
          <p style="font-size:11px;color:#8a8168;margin-bottom:4px;">Leave blank and a group is created for you automatically.</p>
          <input id="bulk-import-group-name" placeholder="e.g. Batch 3 - September"/>
        </div>
      ` : ''}
      <div class="field" style="margin-top:14px;">
        <label>CSV file</label>
        <input type="file" id="csv-file" accept=".csv,text/csv" onchange="handleCsvFileUpload(this)"/>
      </div>
      <label style="display:flex;align-items:center;gap:6px;font-weight:400;text-transform:none;font-size:12px;margin:8px 0 4px;">
        <input type="checkbox" id="csv-has-header" style="width:auto;"/> First row is column headers (skip it)
      </label>
      <details style="margin-top:6px;">
        <summary style="font-size:11px;color:#8a8168;cursor:pointer;">Paste CSV text instead</summary>
        <textarea id="csv-text" style="width:100%;height:120px;font-family:'IBM Plex Mono',monospace;font-size:12px;padding:8px;border:1px solid var(--line);border-radius:8px;margin-top:8px;" placeholder="${esc(def.placeholder)}"></textarea>
      </details>
      <div id="import-progress-wrap" style="display:none;margin-top:14px;">
        <div style="display:flex;justify-content:space-between;font-size:11px;color:#8a8168;margin-bottom:4px;">
          <span id="import-progress-label">Starting…</span>
          <span id="import-progress-pct">0%</span>
        </div>
        <div style="background:var(--sand-deep);border-radius:6px;height:8px;overflow:hidden;">
          <div id="import-progress-fill" style="background:var(--gold);height:100%;width:0%;transition:width .25s ease;"></div>
        </div>
      </div>
      <div style="display:flex;gap:8px;margin-top:14px;">
        <button id="bulk-import-btn" class="primary" style="flex:1" onclick="bulkImportCSV('${entity}'${data.groupId?`,'${data.groupId}'`:''})">Import</button>
        <button id="bulk-import-cancel-btn" class="ghost" onclick="closeModal()">Cancel</button>
      </div>
      <p style="font-size:11px;color:#8a8168;margin-top:12px;">
        Importing something else?
        ${otherEntities.map(([k,label])=>`<a href="#" onclick="event.preventDefault();switchBulkImportEntity('${k}')">${esc(label)}</a>`).join(' &middot; ')}
      </p>
    `;
  } else if(type==='room'){
    body = `
      <h3>Add room</h3>
      <form onsubmit="saveRoom(event)">
        <div class="two-col">
          <div class="field"><label>Leg</label>${customSelectHtml({ name:'hotel_leg', options:[{value:'mecca',label:'Mecca'},{value:'madinah',label:'Madinah'}], searchable:false })}</div>
          <div class="field"><label>Room number</label><input name="room_number" required/></div>
        </div>
        <div class="two-col">
          <div class="field"><label>Capacity</label><input type="number" name="capacity" value="4"/></div>
          <div class="field"><label>Type</label>${customSelectHtml({ name:'gender', options:[{value:'family',label:'Family'},{value:'male',label:'Male only'},{value:'female',label:'Female only'}], searchable:false })}</div>
        </div>
        <div style="display:flex;gap:8px;margin-top:16px;">
          <button type="submit" class="primary" style="flex:1">Save</button>
          <button type="button" class="ghost" onclick="closeModal()">Cancel</button>
        </div>
      </form>
    `;
  } else if(type==='assignRoom'){
    const room = state.rooms.find(r=>r.id===data.roomId);
    const occIds = new Set(roomOccupants(room.id).map(h=>h.id));
    body = `
      <h3>Assign to Room ${esc(room.room_number)}</h3>
      <div class="assign-list">
        ${state.hajis.map(h=>`
          <div class="assign-row">
            <span>${esc(h.full_name)} ${h.family_code?`<span style="color:#8a8168;">(${esc(h.family_code)})</span>`:''}</span>
            <input type="checkbox" style="width:auto;" ${occIds.has(h.id)?'checked':''} onchange="toggleRoomAssign('${room.id}','${h.id}',this.checked)"/>
          </div>
        `).join('') || '<div class="empty">No hajis yet</div>'}
      </div>
      <button class="ghost" style="width:100%;margin-top:12px;" onclick="closeModal()">Done</button>
    `;
  } else if(type==='bus'){
    body = `
      <h3>${data.id?'Edit bus':'Add bus'}</h3>
      <form onsubmit="saveBus(event, ${data.id?`'${data.id}'`:'null'})">
        <div class="two-col">
          <div class="field"><label>Leg</label>${customSelectHtml({ name:'leg', options:[{value:'airport_transfer',label:'Airport transfer'},{value:'mecca_madinah',label:'Mecca ↔ Madinah'},{value:'ziyarat',label:'Ziyarat'}], value:data.leg, searchable:false, onChange:'toggleBusTripField(this)' })}</div>
          <div class="field"><label>Bus number</label><input name="bus_number" value="${esc(data.bus_number||'')}" required/></div>
        </div>
        <div class="field bus-trip-field" style="display:${data.leg==='ziyarat'?'block':'none'};">
          <label>Trip name</label>
          ${customSelectHtml({
            name: 'trip_type_id',
            options: [{value:'',label:'— None —'}, ...state.tripTypes.map(t=>({value:t.id, label:t.name}))],
            value: data.trip_type_id||''
          })}
          ${!state.tripTypes.length ? `<p style="font-size:11px;color:#8a8168;margin-top:4px;">No trip types yet — add some via Manage trip types first.</p>` : ''}
        </div>
        <div class="field">
          <label>Main helper / Sheikh</label>
          ${customSelectHtml({
            name: 'helper_staff_id',
            options: [{value:'',label:'— None —'}, ...state.staffList.map(s=>({value:s.id, label:`${s.full_name} (${roleLabel(s.role)})`}))],
            value: data.helper_staff_id||''
          })}
          <p style="font-size:11px;color:#8a8168;margin-top:4px;">Counts as one passenger toward capacity.</p>
        </div>
        <div class="field"><label>Capacity</label><input type="number" name="capacity" value="${data.capacity??45}"/></div>
        <div style="display:flex;gap:8px;margin-top:16px;">
          <button type="submit" class="primary" style="flex:1">Save</button>
          <button type="button" class="ghost" onclick="closeModal()">Cancel</button>
        </div>
      </form>
    `;
  } else if(type==='assignBus'){
    const bus = state.buses.find(b=>b.id===data.busId);
    const occIds = new Set(busOccupants(bus.id).map(h=>h.id));
    const tripLabel = busTripLabel(bus);
    const helper = bus.helper_staff_id ? staffById(bus.helper_staff_id) : null;
    const pool = bus.trip_type_id ? hajisForTrip(bus.trip_type_id) : state.hajis;
    const familiesMap = new Map();
    pool.forEach(h=>{
      const key = h.family_code || `__solo_${h.id}`;
      if(!familiesMap.has(key)) familiesMap.set(key, []);
      familiesMap.get(key).push(h);
    });
    const families = [...familiesMap.entries()]
      .map(([key,members])=>({ familyCode: key.startsWith('__solo_')?null:key, members: members.sort((a,b)=>a.full_name.localeCompare(b.full_name)) }))
      .sort((a,b)=>(a.familyCode||'￿').localeCompare(b.familyCode||'￿'));
    body = `
      <h3>Assign to Bus ${esc(bus.bus_number)}${tripLabel?` — ${esc(tripLabel)}`:''}</h3>
      <p style="font-size:12px;color:#6b6252;margin-bottom:12px;">
        Helper: ${helper?esc(helper.full_name):'—'} · ${occIds.size + (helper?1:0)}/${bus.capacity} seats used
        ${bus.trip_type_id ? ` · Showing pilgrims booked for ${esc(tripLabel||'this trip')}` : ''}
      </p>
      <div class="assign-list">
        ${families.map(fam=>{
          const assignedHere = fam.members.filter(h=>occIds.has(h.id)).length;
          const splitElsewhere = bus.trip_type_id ? familyBusSplit(fam.familyCode, bus.trip_type_id, bus.id) : [];
          return `
            <div class="family-cluster">
              ${fam.familyCode ? `
                <div class="family-cluster-header">
                  <span><strong>${esc(fam.familyCode)}</strong> <span class="pill ${assignedHere===fam.members.length?'ok':'warn'}">${assignedHere}/${fam.members.length} here</span></span>
                  ${assignedHere<fam.members.length ? `<button class="ghost" onclick="assignFamilyToBus('${bus.id}','${esc(fam.familyCode)}')">Assign whole family</button>` : ''}
                </div>
                ${splitElsewhere.length ? `<div class="family-warning">⚠ Also on ${splitElsewhere.map(s=>`Bus ${esc(s.bus.bus_number)} (${s.members.length})`).join(', ')}</div>` : ''}
              ` : ''}
              ${fam.members.map(h=>`
                <div class="assign-row">
                  <span>${esc(h.full_name)}</span>
                  <input type="checkbox" style="width:auto;" ${occIds.has(h.id)?'checked':''} onchange="toggleBusAssign('${bus.id}','${h.id}',this.checked)"/>
                </div>
              `).join('')}
            </div>
          `;
        }).join('') || `<div class="empty">${bus.trip_type_id ? 'No pilgrims have booked this trip yet' : 'No hajis yet'}</div>`}
      </div>
      <button class="ghost" style="width:100%;margin-top:12px;" onclick="closeModal()">Done</button>
    `;
  } else if(type==='payment'){
    const paidMap = hajiPaidMap();
    body = `
      <h3>Record payment</h3>
      <form onsubmit="savePayment(event)">
        <div class="field"><label>Haji</label>
          ${customSelectHtml({
            name: 'haji_id', required: true,
            options: state.hajis.map(h=>{
              const pkg=packageById(h.package_id); const due=pkg?Number(pkg.price):0; const bal=due-(paidMap.get(h.id)||0);
              return {value:h.id, label:`${h.full_name} — balance ${fmt(bal)}`};
            })
          })}
        </div>
        <div class="two-col">
          <div class="field"><label>Amount (MVR)</label><input type="number" step="0.01" name="amount" required/></div>
          <div class="field"><label>Date</label>${customDateHtml({ name:'paid_on', value: new Date().toISOString().slice(0,10) })}</div>
        </div>
        <div class="field"><label>Method</label>${customSelectHtml({ name:'method', options:[{value:'cash',label:'Cash'},{value:'bank_transfer',label:'Bank transfer'},{value:'other',label:'Other'}], searchable:false })}</div>
        <div class="field"><label>Reference</label><input name="reference" placeholder="Receipt / slip no."/></div>
        <div class="field"><label>Notes</label><input name="notes"/></div>
        <div style="display:flex;gap:8px;margin-top:16px;">
          <button type="submit" class="primary" style="flex:1">Save</button>
          <button type="button" class="ghost" onclick="closeModal()">Cancel</button>
        </div>
      </form>
    `;
  }
  return `<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">${body}</div></div>`;
}

initAuth();
</script>
</body>
</html>
